[package]
name = "simple-daw"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clack-extensions = { version = "0.1.1", features = ["audio-ports", "params", "gui", "clack-host"] }
clack-host = "0.1.1"
cpal = "0.18.1"
eframe = "0.35.0"
egui = "0.35.0"
hound = "3.5.1"
midly = { version = "0.5.3", default-features = false, features = ["std"] }
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
